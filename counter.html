<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn {
            width: 150px;
            height: 50px;
            border-radius: 20px;
            border: none;
            outline: none;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande',
                'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-weight: 800;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            margin-left: 10px;
        }

        .box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            height: 300px;
            width: 400px;
            border-radius: 20px;
            
        }

    </style>

</head>

<body>
    <div class="box">
        <h1 class="count">0</h1>
        <div class="buttons">
            <button class="btn" onclick="AddOne()">Increment</button>
            <button class="btn reset" onclick="Reset()">Reset</button>
        </div>
    </div>

    <script>
        let number = Number(document.querySelector(".count").innerHTML);
        function AddOne() {
            number = number + 1;
            document.querySelector(".count").innerHTML = number;
        }
        function Reset() {
            document.querySelector(".count").innerHTML = 0;
        }
    </script>
</body>

</html>
