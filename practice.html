<!-- Display Property in css -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        .box {
            border: 2px solid blue;
            display: inline-block;
            width: 344px;
            padding: 30px;
            margin: 30px;
        }
    </style>
</head>

<body>
    <div class="box">
        Iam a box
    </div>
    <div class="box">
        Iam also a nice box
    </div>
    <span>
        Iam a good
    </span>
    <span>boy</span>
</body>

</html>
